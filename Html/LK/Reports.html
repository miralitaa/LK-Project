<body>

    <div class="bg">
        <div class="bg-base"></div>
        <svg class="bg-waves" viewBox="0 0 1440 900" preserveAspectRatio="none">
            <path class="wave path-1" d="M-100,200 C300,100 600,400 1500,300" />
            <path class="wave path-2" d="M-100,400 C400,300 700,600 1500,500" />
            <path class="wave path-3" d="M-100,600 C500,500 800,800 1500,700" />
            <path class="wave path-4" d="M-100,800 C600,700 900,1000 1500,900" />
        </svg>
        <div class="floating-shapes">
            <div class="shape shape-circle"></div>
            <div class="shape shape-diamond"></div>
            <div class="shape shape-triangle"></div>
            <div class="shape shape-ring"></div>
            <div class="shape shape-square"></div>
            <div class="shape shape-small-circle"></div>
        </div>
        <svg class="bg-zigzags" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice">
            <polyline class="zigzag zig-1" points="100,100 200,200 300,100 400,200 500,100" />
            <polyline class="zigzag zig-2" points="600,800 700,700 800,800 900,700 1000,800" />
            <polyline class="zigzag zig-3" points="200,500 300,400 400,500 500,400" />
        </svg>
        <div class="glowing-dots">
            <div class="dot dot-1"></div>
            <div class="dot dot-2"></div>
            <div class="dot dot-3"></div>
            <div class="dot dot-4"></div>
            <div class="dot dot-5"></div>
            <div class="dot dot-6"></div>
            <div class="dot dot-7"></div>
            <div class="dot dot-8"></div>
            <div class="dot dot-9"></div>
            <div class="dot dot-10"></div>
        </div>
        <svg class="crow-scene crow-scene-left" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
            <g class="branch-wood">
                <polygon points="-100,400 100,380 200,340 50,350" />
                <polygon points="100,380 200,340 300,320 220,360" />
                <polygon points="200,340 300,320 400,280 340,260" />
            </g>
            <g class="branch-twigs">
                <polygon points="200,340 260,250 320,280 280,350" />
                <polygon points="350,300 400,220 450,250 390,320" />
            </g>
            <g class="branch-leaves">
                <polygon points="260,250 290,190 330,230 300,280" />
                <polygon points="400,220 430,160 460,190 420,240" />
            </g>
            <g class="crow-polygons" transform="translate(120, 30) scale(3.5)">
                <polygon points="45,30 60,25 65,45 55,55 40,50" />
                <polygon points="60,25 70,30 75,50 65,45" />
                <polygon points="55,55 65,45 75,50 70,60 60,65" />
                <polygon points="40,50 55,55 50,70 35,65" />
                <polygon points="35,65 50,70 60,65 55,80 40,85" />
                <polygon points="40,85 55,80 50,95 35,90" />
                <polygon points="45,30 55,20 60,25 55,30" />
                <polygon points="55,20 65,22 60,25" />
                <polygon points="65,22 70,25 60,25" />
                <polygon points="60,65 70,60 85,70 75,75" />
                <polygon points="75,75 85,70 80,80" />
                <polygon points="45,75 48,90 45,95 42,90" />
                <polygon points="50,75 55,90 52,95 48,90" />
            </g>
        </svg>
        <svg class="crow-scene crow-scene-right" viewBox="0 0 600 500" xmlns="http://www.w3.org/2000/svg">
            <g class="branch-wood">
                <polygon points="-100,400 100,380 200,340 50,350" />
                <polygon points="100,380 200,340 300,320 220,360" />
                <polygon points="200,340 300,320 400,280 340,260" />
            </g>
            <g class="branch-twigs">
                <polygon points="200,340 260,250 320,280 280,350" />
                <polygon points="350,300 400,220 450,250 390,320" />
            </g>
            <g class="branch-leaves">
                <polygon points="260,250 290,190 330,230 300,280" />
                <polygon points="400,220 430,160 460,190 420,240" />
            </g>
            <g class="crow-polygons" transform="translate(120, 30) scale(3.5)">
                <polygon points="45,30 60,25 65,45 55,55 40,50" />
                <polygon points="60,25 70,30 75,50 65,45" />
                <polygon points="55,55 65,45 75,50 70,60 60,65" />
                <polygon points="40,50 55,55 50,70 35,65" />
                <polygon points="35,65 50,70 60,65 55,80 40,85" />
                <polygon points="40,85 55,80 50,95 35,90" />
                <polygon points="45,30 55,20 60,25 55,30" />
                <polygon points="55,20 65,22 60,25" />
                <polygon points="65,22 70,25 60,25" />
                <polygon points="60,65 70,60 85,70 75,75" />
                <polygon points="75,75 85,70 80,80" />
                <polygon points="45,75 48,90 45,95 42,90" />
                <polygon points="50,75 55,90 52,95 48,90" />
            </g>
        </svg>
        <div class="white-dots"></div>
    </div>

    <div class="mobile-header">
        <a href="LK.html" class="logo"><img src="../../img/logo.png" alt="Логотип"><span>КОРВО НЕРО</span></a>
        <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>
    </div>

    <aside class="sidebar glass" id="sidebar">
        <a href="LK.html" class="logo"><img src="../../img/logo.png" alt="Логотип"><span>КОРВО НЕРО</span></a>
        <nav class="nav-menu">
            <a href="LK.html">Главная</a>
            <a href="requests.html">Мои заявки</a>
            <a href="Invoices.html">Счета и оплаты</a>
            <a href="Reports.html" class="active">Отчеты 1С</a>
            <a href="Profile.html">Профиль</a>
        </nav>
        <div class="sidebar-bottom">
            <a href="../Index.html" class="btn-circle" title="Вернуться на главную страницу сайта">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </a>
            <a href="../Index.html" class="btn-login">Выйти</a>
        </div>
    </aside>

    <main class="main-content">
        <div class="container">
            <header class="dashboard-header">
                <div>
                    <p class="small-text">// ДОКУМЕНТООБОРОТ</p>
                    <h1 class="section-title">Отчеты 1С</h1>
                </div>
                <button class="btn-main" id="openReportModalBtn">+ Запросить отчет</button>
            </header>

            <div class="dashboard-grid">
                <section class="reports-list-section">
                    <h2 class="block-title">Доступные отчеты</h2>
                    <div class="reports-container js-reports-container">
                    </div>
                </section>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="reportModalOverlay">
        <div class="modal glass">
            <button class="modal-close" id="closeReportModalBtn">&times;</button>
            <h2 class="section-title" style="margin-bottom: 20px;">Запрос отчета</h2>
            <form action="#" id="reportForm">
                <div class="input-group">
                    <label>Тип отчета</label>
                    <select id="reportType">
                        <option value="Оборотно-сальдовая ведомость">Оборотно-сальдовая ведомость</option>
                        <option value="Анализ субконто">Анализ субконто</option>
                        <option value="Карточка счета">Карточка счета</option>
                        <option value="Отчет по проводкам">Отчет по проводкам</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Период</label>
                    <select id="reportPeriod">
                        <option value="Текущий месяц">Текущий месяц</option>
                        <option value="Прошлый месяц">Прошлый месяц</option>
                        <option value="Текущий квартал">Текущий квартал</option>
                        <option value="Текущий год">Текущий год</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Комментарий (необязательно)</label>
                    <textarea id="reportComment" rows="3" placeholder="Уточнения по отчету..."></textarea>
                </div>
                <button type="submit" class="btn-main btn-full">Отправить запрос</button>
            </form>
        </div>
    </div>

</body>
</html>
