    <div class="mobile-header">
        <a href="LK.html" class="logo"><img src="../../img/logo.png" alt="Логотип"><span>КОРВО НЕРО</span></a>
        <button class="burger" id="burgerBtn"><span></span><span></span><span></span></button>

        <a href="LK.html" class="logo"><img src="../../img/logo.png" alt="Логотип"><span>КОРВО НЕРО</span></a>

    <main class="main-content">
        <div class="container">
            <header class="dashboard-header">
                <div>
                    <p class="small-text">// НАСТРОЙКИ АККАУНТА</p>
                    <h1 class="section-title">Профиль</h1>
                </div>
            </header>

            <div class="dashboard-grid">
                <section class="glass profile-section">
                    <h2 class="block-title">Данные компании</h2>
                    <form action="#" class="profile-form" id="profileForm">
                        <div class="input-group">
                            <label>Название компании</label>
                            <input type="text" id="profCompany" placeholder="ООО 'Ромашка'">
                        </div>
                        <div class="input-group">
                            <label>ИНН</label>
                            <input type="text" id="profInn" placeholder="5400000000">
                        </div>
                        <div class="input-group">
                            <label>Юридический адрес</label>
                            <input type="text" id="profAddress" placeholder="г. Новосибирск, ул. Ленина, д. 1">
                        </div>
                        <div class="input-group">
                            <label>Контактное лицо</label>
                            <input type="text" id="profContactName" placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="input-group">
                            <label>Контактный Email</label>
                            <input type="email" id="profEmail" placeholder="ivan@romashka.ru">
                        </div>
                        <div class="input-group">
                            <label>Телефон</label>
                            <input type="tel" id="profPhone" placeholder="+7 (999) 123-45-67">
                        </div>
                        <button type="submit" class="btn-main" style="margin-top: 10px;">Сохранить изменения</button>
                    </form>
                </section>
                
                <section class="glass manager-section">
                    <div class="manager-header">
                        <img src="../../img/logo.png" alt="Аватар" class="manager-avatar">
                        <div class="manager-info">
                            <h3 class="manager-name">Никифоров Роман</h3>
                            <p class="manager-role">Персональный менеджер</p>
                        </div>
                    </div>
                    
                    <div class="manager-divider"></div>

                    <div class="manager-contacts">
                        <a href="tel:+73833902928" class="contact-row">
                            <span class="contact-label">Телефон</span>
                            <span class="contact-value">+7 (383) 390-29-28</span>
                        </a>
                        <a href="mailto:contact@corvonero.ru" class="contact-row">
                            <span class="contact-label">Email</span>
                            <span class="contact-value">contact@corvonero.ru</span>
                        </a>
                    </div>
                </section>
            </div>
